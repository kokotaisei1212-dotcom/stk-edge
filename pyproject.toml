[project]
name = "stk-edge"
version = "0.12.0"
description = "STK edge: masks, hashes and forwards conversation text in your own cloud. The STK engine is not included."
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "httpx", "scikit-learn", "numpy"]
optional-dependencies = { names = ["spacy"] }
license = { file = "LICENSE" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stk"]
